<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>🇧🇪 Belgian Budget OR Optimizer (2025–2029)</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@stlite/mountable@0.75.0/build/stlite.css"
    />
  </head>
  <body>
    <div id="root"></div>
    <script src="https://cdn.jsdelivr.net/npm/@stlite/mountable@0.75.0/build/stlite.js"></script>
    <script>
      stlite.mount(
        {
          requirements: ["numpy", "pandas", "scipy", "plotly"],
          entrypoint: "app.py",
          files: {
            "app.py": {
              url: "./app.py",
            },
            "belgian_budget_data.py": {
              url: "./belgian_budget_data.py",
            },
            "budget_or_model.py": {
              url: "./budget_or_model.py",
            },
          },
        },
        document.getElementById("root")
      );
    </script>
  </body>
</html>
